<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Munchkin moves</title>
<style>
  :root { --bg:#f6f0ff; --card:#fff; --ink:#2b1745; --soft:#7b6a93; --accent:#7c3aed; --accent2:#efe5ff; --line:#e4d8f7; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#170d24; --card:#22152f; --ink:#f3eaff; --soft:#b9a6d3; --accent:#a78bfa; --accent2:#33224a; --line:#3a2a52; } }
  :root[data-theme="dark"] { --bg:#170d24; --card:#22152f; --ink:#f3eaff; --soft:#b9a6d3; --accent:#a78bfa; --accent2:#33224a; --line:#3a2a52; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:460px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { margin:0 0 16px; color:var(--soft); font-size:14px; }
  .stage { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:12px; display:flex; justify-content:center; }
  canvas { display:block; touch-action:manipulation; cursor:pointer; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  button.state { flex:1 1 auto; border:0; border-radius:999px; padding:10px 14px; font:600 15px system-ui, sans-serif; background:var(--accent2); color:var(--ink); cursor:pointer; }
  button.state.on { background:var(--accent); color:#fff; }
  label { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--soft); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 12px; }
  .note { margin-top:16px; font-size:13px; color:var(--soft); }
</style>
</head>
<body>
<main>
  <h1>Munchkin moves 🐾</h1>
  <p class="sub">Test animations made from your PSD layers. Tap the cat to make her hop.</p>
  <div class="stage"><canvas id="c" aria-label="Animated Munchkin cat"></canvas></div>
  <div class="row" id="states">
    <button class="state on" data-s="idle">Idle</button>
    <button class="state" data-s="happy">Happy</button>
    <button class="state" data-s="munch">Munch</button>
    <button class="state" data-s="wave">Wave</button>
    <button class="state" data-s="sleepy">Sleepy</button>
  </div>
  <div class="row">
    <label><input type="checkbox" id="o-outline" checked> Outline</label>
    <label><input type="checkbox" id="o-shadow" checked> Shadows</label>
    <label><input type="checkbox" id="o-slow"> Slow-mo</label>
    <label><input type="checkbox" id="o-pivots"> Show pivots</label>
  </div>
  <p class="note">The eyes and mouth are painted on the head for now, so there's no blinking or chewing mouth yet. Those come with the face layers.</p>
</main>
<script>
// ---- rig: where each cropped piece sits on the original 1254px canvas (pieces are saved at half size) ----
const OFF = {"tail":[722,603],"body":[240,621],"bib":[387,727],"paw_r":[656,757],"paw_l":[240,720],"foot_r":[615,1048],"foot_l":[264,1044],"ear_r":[708,129],"ear_l":[157,81],"head":[105,121],"nose":[539,565],"blush_l":[208,527],"blush_r":[775,613],"whiskers_r":[851,644],"whiskers_l":[73,553]};
const ORDER = ["tail","body","bib","paw_r","paw_l","foot_r","foot_l","ear_r","ear_l","head","nose","blush_l","blush_r","whiskers_r","whiskers_l"];
const PIV = { ground:[580,1195], body:[580,1185], neck:[575,745], tail:[790,1035], earL:[410,395], earR:[800,440],
  pawL:[420,765], pawR:[700,790], whiskL:[262,605], whiskR:[862,690], blushL:[283,593], blushR:[846,673] };
// which pieces cast a soft shadow on what's already drawn underneath (offset in canvas units)
const CAST = { body:[4,10,14,.22], paw_r:[3,12,12,.28], paw_l:[3,12,12,.28], head:[6,24,22,.30], bib:[2,6,8,.18] };
const OUTLINE = "#481379";
const WORLD = { x:-40, y:-170, w:1334, h:1440 };

const imgs = {}, sils = {};
const load = (n) => new Promise((ok) => { const i = new Image(); i.onload = () => ok([n, i]); i.src = `img/rig/${n}.webp`; });

// ---- poses ----
const D = Math.PI / 180;
const ss = (x) => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
function flick(t, period, off) { const p = ((t + off) % period) / period * period; return p < 0.3 ? Math.sin(Math.PI * p / 0.3) : 0; }
const BASE = { rootY:0, rootSx:1, rootSy:1, bodySx:1, bodySy:1, headRot:0, headDx:0, headDy:0, earL:0, earR:0, tail:0, pawL:0, pawR:0, whisk:0, blush:1, shadow:1, z:0, nom:0 };

const STATES = {
  idle(t) {
    const b = Math.sin(t * 2.2);
    return { bodySy:1 + .014 * b, bodySx:1 - .007 * b, headRot:1.6 * Math.sin(t * .9), headDy:2.5 * Math.sin(t * 2.2 + .6),
      tail:6 * Math.sin(t * 1.6), earL:-11 * flick(t, 4.3, 0), earR:11 * flick(t, 5.7, 2.1), whisk:2.5 * Math.sin(t * 3) };
  },
  happy(t, st) {
    const T = .8, p = (st % T) / T, g = (p + .15) % 1;
    let h = 0, sq = 0, str = 0, a = 0;
    if (g < .35) sq = Math.sin(Math.PI * g / .35);
    else { a = (g - .35) / .65; h = Math.sin(Math.PI * a) * 95; str = (1 - Math.sin(Math.PI * a)) * .06; }
    const up = Math.sin(Math.PI * a);
    return { rootY:-h, rootSy:1 - .1 * sq + str, rootSx:1 + .07 * sq - str * .6, pawL:10 + 32 * up, pawR:-10 - 32 * up,
      earL:-5 + 8 * sq, earR:5 - 8 * sq, tail:14 * Math.sin(t * 9), headRot:3 * Math.sin(st * 2 * Math.PI / T), headDy:6 * sq,
      whisk:5 * Math.sin(t * 10), shadow:1 - h / 260, blush:1 + .08 * up };
  },
  munch(t, st) {
    const c = Math.abs(Math.sin(Math.PI * st / .45)), b = Math.sin(t * 2.2);
    return { bodySy:1 + .012 * b, bodySx:1 - .006 * b, headDy:7 * c, headRot:-2 + 1.5 * Math.sin(t * 1.3), pawL:-12 - 4 * c, pawR:12 + 4 * c,
      blush:1.06 + .1 * (.5 + .5 * Math.sin(t * 4)), tail:8 * Math.sin(t * 2.4), whisk:4 * c, earL:-3 * c, earR:3 * c, nom:1 };
  },
  wave(t, st) {
    const b = Math.sin(t * 2.2), w = Math.sin(st * 9);
    return { bodySy:1 + .012 * b, bodySx:1 - .006 * b, pawR:-44 - 14 * w, headRot:4 + 1.5 * w, earR:6, earL:-2,
      tail:9 * Math.sin(t * 2.6), whisk:3 * Math.sin(t * 3), blush:1.05 };
  },
  sleepy(t) {
    const b = Math.sin(t * .9);
    return { bodySy:1 + .028 * b, bodySx:1 - .014 * b, headRot:7 + 2 * Math.sin(t * .45), headDy:16 + 3 * b, earL:-15, earR:15,
      tail:3 * Math.sin(t * .7), whisk:-3, pawL:-4, pawR:4, z:1, shadow:1.02 };
  },
};

// ---- canvas setup ----
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const buf = document.createElement("canvas"), bx = buf.getContext("2d");
const tmp = document.createElement("canvas"), tx = tmp.getContext("2d");
const sil = document.createElement("canvas"), sx = sil.getContext("2d");
let dpr = 1, k = 1, cssW = 300;
function size() {
  cssW = Math.min(380, document.querySelector(".stage").clientWidth - 24);
  const cssH = cssW * WORLD.h / WORLD.w;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  for (const c of [cv, buf, tmp, sil]) { c.width = Math.round(cssW * dpr); c.height = Math.round(cssH * dpr); }
  cv.style.width = cssW + "px"; cv.style.height = cssH + "px";
  k = cv.width / WORLD.w;
}
window.addEventListener("resize", size);

const view = () => new DOMMatrix([k, 0, 0, k, -WORLD.x * k, -WORLD.y * k]);
const around = (m, [px, py], fn) => { m.translateSelf(px, py); fn(m); m.translateSelf(-px, -py); return m; };
const rot = (m, p, deg) => around(m, p, (q) => q.rotateSelf(deg));
const scl = (m, p, sx, sy) => around(m, p, (q) => q.scaleSelf(sx, sy));

function matrices(P) {
  const root = view().translateSelf(0, P.rootY); scl(root, PIV.ground, P.rootSx, P.rootSy);
  const body = scl(DOMMatrix.fromMatrix(root), PIV.body, P.bodySx, P.bodySy);
  const neckShift = (PIV.neck[1] - PIV.body[1]) * (P.bodySy - 1);
  const head = DOMMatrix.fromMatrix(root).translateSelf(P.headDx, neckShift + P.headDy); rot(head, PIV.neck, P.headRot);
  const c = (m) => DOMMatrix.fromMatrix(m);
  return {
    tail: rot(c(body), PIV.tail, P.tail), body, bib: body,
    paw_l: rot(c(body), PIV.pawL, P.pawL), paw_r: rot(c(body), PIV.pawR, P.pawR),
    foot_l: root, foot_r: root,
    ear_l: rot(c(head), PIV.earL, P.earL), ear_r: rot(c(head), PIV.earR, P.earR),
    head, nose: head,
    blush_l: scl(c(head), PIV.blushL, P.blush, P.blush), blush_r: scl(c(head), PIV.blushR, P.blush, P.blush),
    whiskers_l: rot(c(head), PIV.whiskL, -P.whisk), whiskers_r: rot(c(head), PIV.whiskR, P.whisk),
  };
}

function drawPart(g, n, m, src = imgs[n]) {
  g.setTransform(m);
  g.drawImage(src, OFF[n][0], OFF[n][1], src.width * 2, src.height * 2);
}

function frame(P, opts) {
  const M = matrices(P);
  bx.setTransform(1, 0, 0, 1, 0, 0); bx.clearRect(0, 0, buf.width, buf.height);
  for (const n of ORDER) {
    const cs = CAST[n];
    if (opts.shadow && cs) {
      // soft shadow of this piece, only where something is already painted underneath
      const [dx, dy, blur, alpha] = cs, W = tmp.width * 2;
      tx.setTransform(1, 0, 0, 1, 0, 0); tx.clearRect(0, 0, tmp.width, tmp.height);
      tx.shadowColor = `rgba(52,14,96,${alpha})`; tx.shadowBlur = blur * k; tx.shadowOffsetX = W + dx * k; tx.shadowOffsetY = dy * k;
      drawPart(tx, n, new DOMMatrix([1, 0, 0, 1, -W, 0]).multiply(M[n]), sils[n]);
      tx.shadowColor = "transparent";
      bx.setTransform(1, 0, 0, 1, 0, 0); bx.globalCompositeOperation = "source-atop"; bx.drawImage(tmp, 0, 0); bx.globalCompositeOperation = "source-over";
    }
    drawPart(bx, n, M[n]);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  if (opts.shadow) { // ground shadow
    ctx.setTransform(view());
    const s = Math.max(.45, P.shadow);
    const gr = ctx.createRadialGradient(580, 1205, 0, 580, 1205, 330 * s);
    gr.addColorStop(0, `rgba(52,14,96,${.28 * s})`); gr.addColorStop(1, "rgba(52,14,96,0)");
    ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(580, 1205, 330 * s, 42 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  if (opts.outline) { // thin outline around the whole cat
    sx.setTransform(1, 0, 0, 1, 0, 0); sx.clearRect(0, 0, sil.width, sil.height);
    sx.drawImage(buf, 0, 0); sx.globalCompositeOperation = "source-in"; sx.fillStyle = OUTLINE; sx.fillRect(0, 0, sil.width, sil.height); sx.globalCompositeOperation = "source-over";
    const r = 1.6 * dpr;
    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; ctx.drawImage(sil, Math.cos(a) * r, Math.sin(a) * r); }
  }
  ctx.drawImage(buf, 0, 0);
  extras(P, opts);
}

function extras(P, opts) {
  ctx.setTransform(view());
  ctx.textAlign = "center"; ctx.fillStyle = OUTLINE;
  if (P.z > .05) {
    for (let i = 0; i < 3; i++) {
      const q = ((now / 1000 * .35) + i / 3) % 1;
      ctx.globalAlpha = P.z * Math.sin(Math.PI * q);
      ctx.font = `700 ${60 + 50 * q}px system-ui, sans-serif`;
      ctx.fillText("z", 900 + 140 * q + 25 * Math.sin(q * 6), 230 - 330 * q);
    }
  }
  if (P.nom > .05) {
    const q = (now / 1000 * .9) % 1;
    ctx.globalAlpha = P.nom * Math.sin(Math.PI * q);
    ctx.font = "800 70px system-ui, sans-serif";
    ctx.fillText("nom", 960 + 30 * q, 300 - 120 * q);
  }
  ctx.globalAlpha = 1;
  if (opts.pivots) {
    const M = matrices(P), at = { tail:"tail", earL:"ear_l", earR:"ear_r", pawL:"paw_l", pawR:"paw_r", neck:"head", whiskL:"whiskers_l", whiskR:"whiskers_r", body:"body" };
    for (const [key, part] of Object.entries(at)) {
      const pt = M[part].transformPoint(new DOMPoint(...PIV[key]));
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#ff2d87"; ctx.beginPath(); ctx.arc(pt.x, pt.y, 4 * dpr, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ---- loop with smooth blending between states ----
let state = "idle", since = 0, from = null, blendStart = 0, now = 0, simT = 0, last = performance.now(), hopUntil = 0;
const opts = () => ({ outline: document.getElementById("o-outline").checked, shadow: document.getElementById("o-shadow").checked, pivots: document.getElementById("o-pivots").checked });
const full = (o) => ({ ...BASE, ...o });
let current = full({});
function setState(s) {
  from = { ...current }; blendStart = simT; state = s; since = simT;
  document.querySelectorAll("button.state").forEach((b) => b.classList.toggle("on", b.dataset.s === s));
}
document.getElementById("states").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { hopUntil = 0; setState(b.dataset.s); } });
let back = "idle";
cv.addEventListener("click", () => { if (state !== "happy") back = state; hopUntil = simT + 1.6; setState("happy"); });

function tick(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  simT += dt * (document.getElementById("o-slow").checked ? .3 : 1); now = simT * 1000;
  if (hopUntil && simT > hopUntil) { hopUntil = 0; setState(back); }
  let P = full(STATES[state](simT, simT - since));
  if (from) {
    const w = ss((simT - blendStart) / .35);
    if (w >= 1) from = null; else for (const key in P) P[key] = from[key] + (P[key] - from[key]) * w;
  }
  current = P;
  frame(P, opts());
  requestAnimationFrame(tick);
}

Promise.all(ORDER.map(load)).then((list) => {
  for (const [n, i] of list) {
    imgs[n] = i;
    const s = document.createElement("canvas"); s.width = i.width; s.height = i.height;
    const g = s.getContext("2d"); g.drawImage(i, 0, 0); g.globalCompositeOperation = "source-in"; g.fillStyle = "#000"; g.fillRect(0, 0, s.width, s.height);
    sils[n] = s;
  }
  size(); requestAnimationFrame(tick);
});
</script>
</body>
</html>
