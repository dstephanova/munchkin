name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install app parts
        working-directory: android-app
        run: npm ci

      - name: Copy the app screen into Android
        working-directory: android-app
        run: npx cap sync android

      - name: Build the install file
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PversionCodeOverride=${{ github.run_number }}

      - name: Name it nicely
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk munchkin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: munchkin-apk
          path: munchkin.apk

      - name: Put it on the download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Munchkin for Android
          body: |
            Tap **munchkin.apk** below to download, then open it on your Android phone to install.
            Built from the latest code (build ${{ github.run_number }}).
          files: munchkin.apk
          make_latest: true
